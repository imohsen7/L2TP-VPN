name: Build L2TP APK Guaranteed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode Project Files
        run: |
          mkdir -p app/src/main/java/com/privatevpn/l2tp
          mkdir -p app/src/main/res/layout
          mkdir -p output_bundle

          echo "" | base64 -d > settings.gradle

          sed -i 's/MyPrivateL2TP(/MyPrivateL2TP"/g' settings.gradle

