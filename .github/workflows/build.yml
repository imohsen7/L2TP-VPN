name: Build L2TP APK Guaranteed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode Project Files
        run: |
          mkdir -p app/src/main/java/com/privatevpn/l2tp
          mkdir -p app/src/main/res/layout
          mkdir -p output_bundle

          echo "" | base64 -d > settings.gradle

          sed -i 's/MyPrivateL2TP(/MyPrivateL2TP"/g' settings.gradle

          echo "cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguMi4wIiBhcHBseSBmYWxzZQogICAgaWQgIm9yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQiIHZlcnNpb24gIjEuOS4yMCIgYXBwbHkgZmFsc2UKfQo=" | base64 -d > build.gradle

          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==" | base64 -d > gradle.properties

          echo "" | base64 -d > app/build.gradle

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          sed -i 's/apk\/res\/android/apk\/res\/android/g' app/src/main/AndroidManifest.xml
          sed -i 's/com\/ajk\/res/com\/apk\/res/g' app/src/main/AndroidManifest.xml
          sed -i 's/LAUNSHER/LAUNCHER/g' app/src/main/AndroidManifest.xml

          echo "" | base64 -d > app/src/main/res/layout/activity_main.xml

          echo " dHggLSBiYXNlVHgpLmNvZXJjZUF0TGVhc3QoMEwpCiAgICAgICAgICAgIHZhbCBzUnggPSAoangtIGxhc3RSeCkuY29lcmNlQXRMZWFzdCgwTCk7IHZhbCBzVHggPSAo " | base64 -d > app/src/main/java/com/privatevpn/l2tp/MainActivity.kt

          sed -i 's/lateinit\x1avar/lateinit var/g' app/src/main/java/com/privatevpn/l2tp/MainActivity.kt
          sed -i 's/jx-/rx -/g' app/src/main/java/com/privatevpn/l2tp/MainActivity.kt
          sed -i 's/MODE_PRIVATA/MODE_PRIVATE/g' app/src/main/java/com/privatevpn/l2tp/MainActivity.kt
          sed -i 's/RECEIVER_NOT_EXPORTED), else/RECEIVER_NOT_EXPORTED) else/g' app/src/main/java/com/privatevpn/l2tp/MainActivity.kt

          echo "" | base64 -d > app/src/main/java/com/privatevpn/l2tp/L2tpVpnService.kt

          sed -i 's/PrivateL2TP(/PrivateL2TP")/g' app/src/main/java/com/privatevpn/l2tp/L2tpVpnService.kt
          sed -i 's/sendBr\x8b\xa0\x86\xde(Intent/sendBroadcast(Intent/g' app/src/main/java/com/privatevpn/l2tp/L2tpVpnService.kt

          zip -r output_bundle/Full_Source_Code.zip settings.gradle build.gradle gradle.properties app/

      - name: Compile APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk output_bundle/MyCustomUI-L2TP-Android7.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ready-To-Download-Bundle
          path: output_bundle/*
