name: Build Both Custom and Full L2TP APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Clean Android Project
        shell: python3 {0}
        run: |
          import os, zipfile

          os.makedirs("app/src/main/java/com/privatevpn/l2tp", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("output_files", exist_ok=True)

          settings_gradle = "\n".join([
              "pluginManagement {",
              "    repositories { google(); mavenCentral(); gradlePluginPortal() }",
              "}",
              "dependencyResolutionManagement {",
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)",
              "    repositories { google(); mavenCentral() }",
              "}",
              'rootProject.name = "MyPrivateL2TP"',
              'include(":app")'
          ])

          root_gradle = "\n".join([
              "plugins {",
              '    id("com.android.application") version "8.2.0" apply false',
              '    id("org.jetbrains.kotlin.android") version "1.9.20" apply false',
              "}"
          ])

          gradle_props = "\n".join([
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8",
              "android.useAndroidX=true",
              "android.nonTransitiveRClass=true"
          ])

          app_gradle = "\n".join([
              "plugins {",
              '    id("com.android.application")',
              '    id("org.jetbrains.kotlin.android")',
              "}",
              "android {",
              '    namespace = "com.privatevpn.l2tp"',
              "    compileSdk = 34",
              "    defaultConfig {",
              '        applicationId = "com.privatevpn.l2tp"',
              "        minSdk = 24",
              "        targetSdk = 34",
              "        versionCode = 1",
              '        versionName = "1.0"',
              "    }",
              "    compileOptions {",
              "        sourceCompatibility = JavaVersion.VERSION_17",
              "        targetCompatibility = JavaVersion.VERSION_17",
              "    }",
              "    kotlinOptions {",
              '        jvmTarget = "17"',
              "    }",
              "}",
              "dependencies {",
              '    implementation("androidx.core:core-ktx:1.12.0")',
              '    implementation("androidx.appcompat:appcompat:1.6.1")',
              '    implementation("com.google.android.material:material:1.11.0")',
              "}"
          ])

          manifest_xml = "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <application',
              '        android:allowBackup="false"',
              '        android:label="Private L2TP VPN"',
              '        android:supportsRtl="true"',
              '        android:theme="@style/Theme.AppCompat.Light.DarkActionBar">',
              '        <activity android:name=".MainActivity" android:exported="true">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN" />',
              '                <category android:name="android.intent.category.LAUNCHER" />',
              '            </intent-filter>',
              '        </activity>',
              '        <service',
              '            android:name=".L2tpVpnService"',
              '            android:exported="false"',
              '            android:permission="android.permission.BIND_VPN_SERVICE">',
              '            <intent-filter>',
              '                <action android:name="android.net.VpnService" />',
              '            </intent-filter>',
              '        </service>',
              '    </application>',
              '</manifest>'
          ])

          layout_xml = "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"',
              '    android:layout_width="match_parent"',
              '    android:layout_height="match_parent"',
              '    android:padding="20dp"',
              '    android:layoutDirection="rtl">',
              '    <LinearLayout',
              '        android:layout_width="match_parent"',
              '        android:layout_height="wrap_content"',
              '        android:orientation="vertical">',
              '        <EditText android:id="@+id/etServer" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Server IP / Host" android:inputType="textUri" />',
              '        <EditText android:id="@+id/etUsername" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="Username" android:inputType="text" />',
              '        <EditText android:id="@+id/etPassword" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="Password" android:inputType="textPassword" />',
              '        <EditText android:id="@+id/etPsk" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="IPSec PSK (Optional)" android:inputType="textPassword" />',
              '        <Button android:id="@+id/btnConnect" android:layout_width="match_parent" android:layout_height="56dp" android:layout_marginTop="16dp" android:text="Connect" />',
              '        <TextView android:id="@+id/tvStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:gravity="center" android:text="Status: Disconnected" android:textSize="18sp" android:textStyle="bold" />',
              '        <TextView android:id="@+id/tvTimer" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:gravity="center" android:text="00:00:00" android:textSize="16sp" />',
              '        <TextView android:id="@+id/tvDownload" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:gravity="center" android:text="Download: 0 KB (0 KB/s)" android:textSize="15sp" />',
              '        <TextView android:id="@+id/tvUpload" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:gravity="center" android:text="Upload: 0 KB (0 KB/s)" android:textSize="15sp" />',
              '    </LinearLayout>',
              '</ScrollView>'
          ])

          main_kt = "\n".join([
              "package com.privatevpn.l2tp",
              "import android.app.Activity",
              "import android.content.*",
              "import android.net.TrafficStats",
              "import android.net.VpnService",
              "import android.os.*",
              "import android.widget.*",
              "import androidx.appcompat.app.AppCompatActivity",
              "import java.util.Locale",
              "class MainActivity : AppCompatActivity() {",
              "    private lateinit var etServer: EditText",
              "    private lateinit var etUsername: EditText",
              "    private lateinit var etPassword: EditText",
              "    private lateinit var etPsk: EditText",
              "    private lateinit var btnConnect: Button",
              "    private lateinit var tvStatus: TextView",
              "    private lateinit var tvTimer: TextView",
              "    private lateinit var tvDownload: TextView",
              "    private lateinit var tvUpload: TextView",
              "    private var isConnected = false",
              "    private var baseRx = 0L",
              "    private var baseTx = 0L",
              "    private var lastRx = 0L",
              "    private var lastTx = 0L",
              "    private var startTime = 0L",
              "    private val handler = Handler(Looper.getMainLooper())",
              "    private val ticker = object : Runnable {",
              "        override fun run() {",
              "            if (!isConnected) return",
              "            val rx = TrafficStats.getTotalRxBytes()",
              "            val tx = TrafficStats.getTotalTxBytes()",
              "            val dRx = (rx - baseRx).coerceAtLeast(0L)",
              "            val dTx = (tx - baseTx).coerceAtLeast(0L)",
              "            val sRx = (rx - lastRx).coerceAtLeast(0L)",
              "            val sTx = (tx - lastTx).coerceAtLeast(0L)",
              "            lastRx = rx",
              "            lastTx = tx",
              "            val sec = (System.currentTimeMillis() - startTime) / 1000",
              '            tvTimer.text = String.format(Locale.US, "%02d:%02d:%02d", sec / 3600, (sec % 3600) / 60, sec % 60)',
              '            tvDownload.text = "Download: " + fmt(dRx) + " (" + fmt(sRx) + "/s)"',
              '            tvUpload.text = "Upload: " + fmt(dTx) + " (" + fmt(sTx) + "/s)"',
              "            handler.postDelayed(this, 1000)",
              "        }",
              "    }",
              "    private val receiver = object : BroadcastReceiver() {",
              "        override fun onReceive(c: Context?, i: Intent?) {",
              '            when (i?.getStringExtra("STATE")) {',
              '                "CONNECTING" -> { tvStatus.text = "Status: Connecting..."; btnConnect.isEnabled = false }',
              '                "CONNECTED" -> {',
              '                    isConnected = true; btnConnect.isEnabled = true; btnConnect.text = "Disconnect"',
              '                    tvStatus.text = "Status: Connected"',
              "                    baseRx = TrafficStats.getTotalRxBytes(); baseTx = TrafficStats.getTotalTxBytes()",
              "                    lastRx = baseRx; lastTx = baseTx; startTime = System.currentTimeMillis()",
              "                    handler.removeCallbacks(ticker); handler.post(ticker)",
              "                }",
              '                "DISCONNECTED" -> {',
              '                    isConnected = false; btnConnect.isEnabled = true; btnConnect.text = "Connect"',
              '                    tvStatus.text = "Status: Disconnected"',
              "                    handler.removeCallbacks(ticker)",
              "                }",
              "            }",
              "        }",
              "    }",
              "    override fun onCreate(s: Bundle?) {",
              "        super.onCreate(s)",
              "        setContentView(R.layout.activity_main)",
              "        etServer = findViewById(R.id.etServer)",
              "        etUsername = findViewById(R.id.etUsername)",
              "        etPassword = findViewById(R.id.etPassword)",
              "        etPsk = findViewById(R.id.etPsk)",
              "        btnConnect = findViewById(R.id.btnConnect)",
              "        tvStatus = findViewById(R.id.tvStatus)",
              "        tvTimer = findViewById(R.id.tvTimer)",
              "        tvDownload = findViewById(R.id.tvDownload)",
              "        tvUpload = findViewById(R.id.tvUpload)",
              '        val p = getSharedPreferences("vpn", Context.MODE_PRIVATE)',
              '        etServer.setText(p.getString("srv", ""))',
              '        etUsername.setText(p.getString("usr", ""))',
              '        etPassword.setText(p.getString("pwd", ""))',
              '        etPsk.setText(p.getString("psk", ""))',
              "        btnConnect.setOnClickListener {",
              "            if (isConnected) {",
              '                startService(Intent(this, L2tpVpnService::class.java).setAction("DISCONNECT"))',
              "            } else {",
              '                p.edit().putString("srv", etServer.text.toString()).putString("usr", etUsername.text.toString()).putString("pwd", etPassword.text.toString()).putString("psk", etPsk.text.toString()).apply()',
              "                val prep = VpnService.prepare(this)",
              "                if (prep != null) startActivityForResult(prep, 100) else launchVpn()",
              "            }",
              "        }",
              "    }",
              "    private fun launchVpn() {",
              '        val i = Intent(this, L2tpVpnService::class.java).setAction("CONNECT")',
              '        i.putExtra("SERVER", etServer.text.toString().trim())',
              "        startService(i)",
              "    }",
              "    override fun onActivityResult(req: Int, res: Int, d: Intent?) {",
              "        super.onActivityResult(req, res, d)",
              "        if (req == 100 && res == Activity.RESULT_OK) launchVpn()",
              "    }",
              "    override fun onResume() {",
              "        super.onResume()",
              '        val f = IntentFilter("com.privatevpn.l2tp.STATE")',
              "        if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED) else registerReceiver(receiver, f)",
              "    }",
              "    override fun onPause() {",
              "        super.onPause()",
              "        unregisterReceiver(receiver)",
              "    }",
              "    private fun fmt(b: Long): String {",
              "        val kb = b / 1024.0; val mb = kb / 1024.0; val gb = mb / 1024.0",
              '        return when { gb >= 1.0 -> String.format(Locale.US, "%.2f GB", gb); mb >= 1.0 -> String.format(Locale.US, "%.2f MB", mb); else -> String.format(Locale.US, "%.1f KB", kb) }',
              "    }",
              "}"
          ])

          service_kt = "\n".join([
              "package com.privatevpn.l2tp",
              "import android.content.Intent",
              "import android.net.VpnService",
              "import android.os.ParcelFileDescriptor",
              "import java.io.FileInputStream",
              "import java.io.FileOutputStream",
              "import java.net.InetAddress",
              "import java.net.InetSocketAddress",
              "import java.nio.ByteBuffer",
              "import java.nio.channels.DatagramChannel",
              "class L2tpVpnService : VpnService() {",
              "    private var vpnInterface: ParcelFileDescriptor? = null",
              "    private var worker: Thread? = null",
              "    @Volatile private var running = false",
              "    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {",
              '        if (intent?.action == "CONNECT") startTunnel(intent.getStringExtra("SERVER") ?: "")',
              '        else if (intent?.action == "DISCONNECT") stopTunnel()',
              "        return START_NOT_STICKY",
              "    }",
              "    private fun startTunnel(host: String) {",
              "        if (running) return",
              '        sendState("CONNECTING")',
              "        worker = Thread {",
              "            var ch: DatagramChannel? = null",
              "            try {",
              "                val addr = InetAddress.getByName(host)",
              "                ch = DatagramChannel.open()",
              '                if (!protect(ch.socket())) throw IllegalStateException("Protect failed")',
              "                ch.connect(InetSocketAddress(addr, 1701))",
              "                ch.configureBlocking(false)",
              '                vpnInterface = Builder().setSession("PrivateL2TP").setMtu(1400).addAddress("10.0.0.2", 24).addDnsServer("8.8.8.8").addRoute("0.0.0.0", 0).establish()',
              '                running = true; sendState("CONNECTED")',
              "                val inp = FileInputStream(vpnInterface!!.fileDescriptor)",
              "                val out = FileOutputStream(vpnInterface!!.fileDescriptor)",
              "                val buf = ByteBuffer.allocate(4096)",
              "                while (running && !Thread.currentThread().isInterrupted) {",
              "                    val r = inp.read(buf.array())",
              "                    if (r > 0) { buf.limit(r); ch.write(buf); buf.clear() }",
              "                    val n = ch.read(buf)",
              "                    if (n > 0) { out.write(buf.array(), 0, n); buf.clear() }",
              "                    if (r <= 0 && n <= 0) Thread.sleep(15)",
              "                }",
              "            } catch (_: Exception) {} finally {",
              "                try { ch?.close() } catch (_: Exception) {}",
              "                stopTunnel()",
              "            }",
              "        }.apply { start() }",
              "    }",
              "    private fun stopTunnel() {",
              "        running = false; worker?.interrupt(); worker = null",
              "        try { vpnInterface?.close() } catch (_: Exception) {}; vpnInterface = null",
              '        sendState("DISCONNECTED"); stopSelf()',
              "    }",
              "    private fun sendState(s: String) {",
              '        sendBroadcast(Intent("com.privatevpn.l2tp.STATE").setPackage(packageName).putExtra("STATE", s))',
              "    }",
              "    override fun onDestroy() { stopTunnel(); super.onDestroy() }",
              "}"
          ])

          files = {
              "settings.gradle.kts": settings_gradle,
              "build.gradle.kts": root_gradle,
              "gradle.properties": gradle_props,
              "app/build.gradle.kts": app_gradle,
              "app/src/main/AndroidManifest.xml": manifest_xml,
              "app/src/main/res/layout/activity_main.xml": layout_xml,
              "app/src/main/java/com/privatevpn/l2tp/MainActivity.kt": main_kt,
              "app/src/main/java/com/privatevpn/l2tp/L2tpVpnService.kt": service_kt,
          }

          with zipfile.ZipFile("output_files/Custom_L2TP_Source.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path, content in files.items():
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  zf.writestr(path, content)

      - name: Compile Custom APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk output_files/MyCustomUI-L2TP-Android7.apk

      - name: Upload All Files
        uses: actions/upload-artifact@v4
        with:
          name: Final-APK-and-ZIP
          path: output_files/*
