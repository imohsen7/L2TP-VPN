name: Build L2TP APK Fixed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Android Project Files
        run: |
          mkdir -p app/src/main/java/com/privatevpn/l2tp
          mkdir -p app/src/main/res/layout
          mkdir -p output_bundle

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories { google(); mavenCentral(); gradlePluginPortal() }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories { google(); mavenCentral() }' \
            '}' \
            'rootProject.name = "MyPrivateL2TP"' \
            'include ":app"' > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.2.0" apply false' \
            '    id "org.jetbrains.kotlin.android" version "1.9.20" apply false' \
            '}' > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '    id "org.jetbrains.kotlin.android"' \
            '}' \
            'android {' \
            '    namespace "com.privatevpn.l2tp"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.privatevpn.l2tp"' \
            '        minSdk 24' \
            '        targetSdk 34' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions { jvmTarget = "17" }' \
            '}' \
            'dependencies {' \
            '    implementation "androidx.core:core-ktx:1.12.0"' \
            '    implementation "androidx.appcompat:appcompat:1.6.1"' \
            '    implementation "com.google.android.material:material:1.11.0"' \
            '}' > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
            '    <application' \
            '        android:allowBackup="false"' \
            '        android:label="Private L2TP VPN"' \
            '        android:supportsRtl="true"' \
            '        android:theme="@style/Theme.AppCompat.Light.DarkActionBar">' \
            '        <activity android:name=".MainActivity" android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '        <service android:name=".L2tpVpnService" android:exported="false" android:permission="android.permission.BIND_VPN_SERVICE">' \
            '            <intent-filter><action android:name="android.net.VpnService" /></intent-filter>' \
            '        </service>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="20dp" android:layoutDirection="rtl">' \
            '    <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">' \
            '        <EditText android:id="@+id/etServer" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Server IP / Host" android:inputType="textUri" />' \
            '        <EditText android:id="@+id/etUsername" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="Username" android:inputType="text" />' \
            '        <EditText android:id="@+id/etPassword" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="Password" android:inputType="textPassword" />' \
            '        <EditText android:id="@+id/etPsk" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:hint="IPSec PSK (Optional)" android:inputType="textPassword" />' \
            '        <Button android:id="@+id/btnConnect" android:layout_width="match_parent" android:layout_height="56dp" android:layout_marginTop="16dp" android:text="Connect / اتصال" />' \
            '        <TextView android:id="@+id/tvStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="20dp" android:gravity="center" android:text="Status: Disconnected" android:textSize="18sp" android:textStyle="bold" />' \
            '        <TextView android:id="@+id/tvTimer" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:gravity="center" android:text="00:00:00" android:textSize="16sp" />' \
            '        <TextView android:id="@+id/tvDownload" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop
